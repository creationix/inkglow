<text x="14" y="57" fill="#4a4a55"> 1</text>
<text y="57" xml:space="preserve"><tspan x="42" fill="#8877aa" font-style='italic'>// A sample to preview theme colors</tspan></text>
<text x="14" y="76" fill="#4a4a55"> 2</text>
<text y="76" xml:space="preserve"><tspan x="42" fill="#ff9944">fn </tspan><tspan fill="#a6e22e">fibonacci</tspan><tspan fill="#8899aa">(</tspan><tspan fill="#44aaee" font-style='italic'>n</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#66ccdd">u32</tspan><tspan fill="#8899aa">)</tspan><tspan fill="#ff7755"> -&gt; </tspan><tspan fill="#66ccdd">u32</tspan><tspan fill="#8899aa"> {</tspan></text>
<text x="14" y="95" fill="#4a4a55"> 3</text>
<text y="95" xml:space="preserve"><tspan x="42" fill="#77bbff">  if </tspan><tspan fill="#44aaee" font-style='italic'>n</tspan><tspan fill="#ff7755"> &lt;= </tspan><tspan fill="#eebb55">1</tspan><tspan fill="#77bbff"> return </tspan><tspan fill="#44aaee" font-style='italic'>n</tspan></text>
<text x="14" y="114" fill="#4a4a55"> 4</text>
<text y="114" xml:space="preserve"><tspan x="42" fill="#ff9944">  let </tspan><tspan fill="#99ccff">result</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#a6e22e">fibonacci</tspan><tspan fill="#8899aa">(</tspan><tspan fill="#44aaee" font-style='italic'>n</tspan><tspan fill="#ff7755"> - </tspan><tspan fill="#eebb55">1</tspan><tspan fill="#8899aa">)</tspan></text>
<text x="14" y="133" fill="#4a4a55"> 5</text>
<text y="133" xml:space="preserve"><tspan x="42" fill="#77bbff">  return </tspan><tspan fill="#99ccff">result</tspan></text>
<text x="14" y="152" fill="#4a4a55"> 6</text>
<text y="152" xml:space="preserve"><tspan x="42" fill="#8899aa">}</tspan></text>
<text x="14" y="171" fill="#4a4a55"> 7</text>
<text x="14" y="190" fill="#4a4a55"> 8</text>
<text y="190" xml:space="preserve"><tspan x="42" fill="#8877aa" font-style='italic'>// Types and strings</tspan></text>
<text x="14" y="209" fill="#4a4a55"> 9</text>
<text y="209" xml:space="preserve"><tspan x="42" fill="#ff9944">struct </tspan><tspan fill="#66ccdd">Config</tspan><tspan fill="#8899aa"> {</tspan></text>
<text x="14" y="228" fill="#4a4a55">10</text>
<text y="228" xml:space="preserve"><tspan x="42" fill="#ff9944">  </tspan><tspan fill="#99ccff">name</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#66ccdd">String</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#55cc99">&quot;hello world&quot;</tspan></text>
<text x="14" y="247" fill="#4a4a55">11</text>
<text y="247" xml:space="preserve"><tspan x="42" fill="#ff9944">  </tspan><tspan fill="#99ccff">count</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#66ccdd">u32</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#eebb55">42</tspan></text>
<text x="14" y="266" fill="#4a4a55">12</text>
<text y="266" xml:space="preserve"><tspan x="42" fill="#ff9944">  </tspan><tspan fill="#99ccff">enabled</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#66ccdd">bool</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#9988ff" font-style='italic'>true</tspan></text>
<text x="14" y="285" fill="#4a4a55">13</text>
<text y="285" xml:space="preserve"><tspan x="42" fill="#ff9944">  </tspan><tspan fill="#99ccff">path</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#66ccdd">String</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#55cc99">&quot;line 1</tspan><tspan fill="#80d8ae" font-weight='bold'>\n</tspan><tspan fill="#55cc99">line 2&quot;</tspan></text>
<text x="14" y="304" fill="#4a4a55">14</text>
<text y="304" xml:space="preserve"><tspan x="42" fill="#8899aa">}</tspan></text>
<text x="14" y="323" fill="#4a4a55">15</text>
<text x="14" y="342" fill="#4a4a55">16</text>
<text y="342" xml:space="preserve"><tspan x="42" fill="#8877aa" font-style='italic'>// Global and output params</tspan></text>
<text x="14" y="361" fill="#4a4a55">17</text>
<text y="361" xml:space="preserve"><tspan x="42" fill="#ff9944">let </tspan><tspan fill="#ff88aa">GLOBAL_STATE</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#eebb55">0</tspan></text>
<text x="14" y="380" fill="#4a4a55">18</text>
<text y="380" xml:space="preserve"><tspan x="42" fill="#ff9944">fn </tspan><tspan fill="#a6e22e">swap</tspan><tspan fill="#8899aa">(</tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#66ccdd">u32</tspan><tspan fill="#ff7755">, </tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#ff7755">: </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#66ccdd">u32</tspan><tspan fill="#8899aa">)</tspan><tspan fill="#8899aa"> {</tspan></text>
<text x="14" y="399" fill="#4a4a55">19</text>
<text y="399" xml:space="preserve"><tspan x="42" fill="#ff9944">  let </tspan><tspan fill="#99ccff">tmp</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>a</tspan></text>
<text x="14" y="418" fill="#4a4a55">20</text>
<text y="418" xml:space="preserve"><tspan x="42" fill="#77bbff">  </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>b</tspan></text>
<text x="14" y="437" fill="#4a4a55">21</text>
<text y="437" xml:space="preserve"><tspan x="42" fill="#77bbff">  </tspan><tspan fill="#44ccff">*</tspan><tspan fill="#ff6644" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#ff7755"> = </tspan><tspan fill="#99ccff">tmp</tspan></text>
<text x="14" y="456" fill="#4a4a55">22</text>
