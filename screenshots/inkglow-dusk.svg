<text x="14" y="57" fill="#46374f"> 1</text>
<text y="57" xml:space="preserve"><tspan x="42" fill="#a3a5be" font-style='italic'>// A sample to preview theme colors</tspan></text>
<text x="14" y="76" fill="#46374f"> 2</text>
<text y="76" xml:space="preserve"><tspan x="42" fill="#e9a961">fn </tspan><tspan fill="#cdd267">fibonacci</tspan><tspan fill="#a3a5be">(</tspan><tspan fill="#98d0cd" font-style='italic'>n</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">u32</tspan><tspan fill="#a3a5be">)</tspan><tspan fill="#b15962"> -&gt; </tspan><tspan fill="#5d9db1">u32</tspan><tspan fill="#a3a5be"> {</tspan></text>
<text x="14" y="95" fill="#46374f"> 3</text>
<text y="95" xml:space="preserve"><tspan x="42" fill="#98d0cd">  if </tspan><tspan fill="#98d0cd" font-style='italic'>n</tspan><tspan fill="#b15962"> &lt;= </tspan><tspan fill="#dfaf97">1</tspan><tspan fill="#98d0cd"> return </tspan><tspan fill="#98d0cd" font-style='italic'>n</tspan></text>
<text x="14" y="114" fill="#46374f"> 4</text>
<text y="114" xml:space="preserve"><tspan x="42" fill="#e9a961">  let </tspan><tspan fill="#f7f1c8">result</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#cdd267">fibonacci</tspan><tspan fill="#a3a5be">(</tspan><tspan fill="#98d0cd" font-style='italic'>n</tspan><tspan fill="#b15962"> - </tspan><tspan fill="#dfaf97">1</tspan><tspan fill="#a3a5be">)</tspan></text>
<text x="14" y="133" fill="#46374f"> 5</text>
<text y="133" xml:space="preserve"><tspan x="42" fill="#98d0cd">  return </tspan><tspan fill="#f7f1c8">result</tspan></text>
<text x="14" y="152" fill="#46374f"> 6</text>
<text y="152" xml:space="preserve"><tspan x="42" fill="#a3a5be">}</tspan></text>
<text x="14" y="171" fill="#46374f"> 7</text>
<text x="14" y="190" fill="#46374f"> 8</text>
<text y="190" xml:space="preserve"><tspan x="42" fill="#a3a5be" font-style='italic'>// Types and strings</tspan></text>
<text x="14" y="209" fill="#46374f"> 9</text>
<text y="209" xml:space="preserve"><tspan x="42" fill="#e9a961">struct </tspan><tspan fill="#98d0cd">Config</tspan><tspan fill="#a3a5be"> {</tspan></text>
<text x="14" y="228" fill="#46374f">10</text>
<text y="228" xml:space="preserve"><tspan x="42" fill="#e9a961">  </tspan><tspan fill="#f7f1c8">name</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">String</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#cdd267">&quot;hello world&quot;</tspan></text>
<text x="14" y="247" fill="#46374f">11</text>
<text y="247" xml:space="preserve"><tspan x="42" fill="#e9a961">  </tspan><tspan fill="#f7f1c8">count</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">u32</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#dfaf97">42</tspan></text>
<text x="14" y="266" fill="#46374f">12</text>
<text y="266" xml:space="preserve"><tspan x="42" fill="#e9a961">  </tspan><tspan fill="#f7f1c8">enabled</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">bool</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#db838d" font-style='italic'>true</tspan></text>
<text x="14" y="285" fill="#46374f">13</text>
<text y="285" xml:space="preserve"><tspan x="42" fill="#e9a961">  </tspan><tspan fill="#f7f1c8">path</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">String</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#cdd267">&quot;line 1</tspan><tspan fill="#d9dd8d" font-weight='bold'>\n</tspan><tspan fill="#cdd267">line 2&quot;</tspan></text>
<text x="14" y="304" fill="#46374f">14</text>
<text y="304" xml:space="preserve"><tspan x="42" fill="#a3a5be">}</tspan></text>
<text x="14" y="323" fill="#46374f">15</text>
<text x="14" y="342" fill="#46374f">16</text>
<text y="342" xml:space="preserve"><tspan x="42" fill="#a3a5be" font-style='italic'>// Global and output params</tspan></text>
<text x="14" y="361" fill="#46374f">17</text>
<text y="361" xml:space="preserve"><tspan x="42" fill="#e9a961">let </tspan><tspan fill="#db838d">GLOBAL_STATE</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#dfaf97">0</tspan></text>
<text x="14" y="380" fill="#46374f">18</text>
<text y="380" xml:space="preserve"><tspan x="42" fill="#e9a961">fn </tspan><tspan fill="#cdd267">swap</tspan><tspan fill="#a3a5be">(</tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#5d9db1">u32</tspan><tspan fill="#b15962">, </tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#b15962">: </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#5d9db1">u32</tspan><tspan fill="#a3a5be">)</tspan><tspan fill="#a3a5be"> {</tspan></text>
<text x="14" y="399" fill="#46374f">19</text>
<text y="399" xml:space="preserve"><tspan x="42" fill="#e9a961">  let </tspan><tspan fill="#f7f1c8">tmp</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>a</tspan></text>
<text x="14" y="418" fill="#46374f">20</text>
<text y="418" xml:space="preserve"><tspan x="42" fill="#98d0cd">  </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>b</tspan></text>
<text x="14" y="437" fill="#46374f">21</text>
<text y="437" xml:space="preserve"><tspan x="42" fill="#98d0cd">  </tspan><tspan fill="#5d9db1">*</tspan><tspan fill="#e9a961" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#b15962"> = </tspan><tspan fill="#f7f1c8">tmp</tspan></text>
<text x="14" y="456" fill="#46374f">22</text>
<text y="456" xml:space="preserve"><tspan x="42" fill="#a3a5be">}</tspan></text>
