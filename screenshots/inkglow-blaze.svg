<text y="240" xml:space="preserve"><tspan x="46" fill="#ffa300">  </tspan><tspan fill="#c2c3c7">enabled</tspan><tspan fill="#ff004d">: </tspan><tspan fill="#29adff">bool</tspan><tspan fill="#ff004d"> = </tspan><tspan fill="#ff77a8" font-style='italic'>true</tspan></text>
