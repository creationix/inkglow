<text y="228" xml:space="preserve"><tspan x="42" fill="#9d303b">  </tspan><tspan fill="#3e2137">name</tspan><tspan fill="#70377f">: </tspan><tspan fill="#34859d">String</tspan><tspan fill="#70377f"> = </tspan><tspan fill="#647d34">&quot;hello world&quot;</tspan></text>
<text x="14" y="247" fill="#9a6348">11</text>
<text y="247" xml:space="preserve"><tspan x="42" fill="#9d303b">  </tspan><tspan fill="#3e2137">count</tspan><tspan fill="#70377f">: </tspan><tspan fill="#34859d">u32</tspan><tspan fill="#70377f"> = </tspan><tspan fill="#9a6348">42</tspan></text>
<text x="14" y="266" fill="#9a6348">12</text>
<text y="266" xml:space="preserve"><tspan x="42" fill="#9d303b">  </tspan><tspan fill="#3e2137">enabled</tspan><tspan fill="#70377f">: </tspan><tspan fill="#34859d">bool</tspan><tspan fill="#70377f"> = </tspan><tspan fill="#9d303b" font-style='italic'>true</tspan></text>
