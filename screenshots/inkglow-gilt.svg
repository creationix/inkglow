<text y="380" xml:space="preserve"><tspan x="42" fill="#9d303b">fn </tspan><tspan fill="#647d34">swap</tspan><tspan fill="#8c8fae">(</tspan><tspan fill="#9d303b" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#70377f">: </tspan><tspan fill="#17434b">*</tspan><tspan fill="#34859d">u32</tspan><tspan fill="#70377f">, </tspan><tspan fill="#9d303b" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#70377f">: </tspan><tspan fill="#17434b">*</tspan><tspan fill="#34859d">u32</tspan><tspan fill="#8c8fae">)</tspan><tspan fill="#8c8fae"> {</tspan></text>
