<text y="361" xml:space="preserve"><tspan x="42" fill="#9d303b">let </tspan><tspan fill="#70377f">GLOBAL_STATE</tspan><tspan fill="#70377f"> = </tspan><tspan fill="#9a6348">0</tspan></text>
