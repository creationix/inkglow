<text x="14" y="57" fill="#9a6348"> 1</text>
<text y="57" xml:space="preserve"><tspan x="42" fill="#584563" font-style='italic'>// A sample to preview theme colors</tspan></text>
<text x="14" y="76" fill="#9a6348"> 2</text>
<text y="76" xml:space="preserve"><tspan x="42" fill="#9d303b">fn </tspan><tspan fill="#647d34">fibonacci</tspan><tspan fill="#8c8fae">(</tspan><tspan fill="#34859d" font-style='italic'>n</tspan><tspan fill="#70377f">: </tspan><tspan fill="#34859d">u32</tspan><tspan fill="#8c8fae">)</tspan><tspan fill="#70377f"> -&gt; </tspan><tspan fill="#34859d">u32</tspan><tspan fill="#8c8fae"> {</tspan></text>
<text x="14" y="95" fill="#9a6348"> 3</text>
<text y="95" xml:space="preserve"><tspan x="42" fill="#17434b">  if </tspan><tspan fill="#34859d" font-style='italic'>n</tspan><tspan fill="#70377f"> &lt;= </tspan><tspan fill="#9a6348">1</tspan><tspan fill="#17434b"> return </tspan><tspan fill="#34859d" font-style='italic'>n</tspan></text>
<text x="14" y="114" fill="#9a6348"> 4</text>
<text y="114" xml:space="preserve"><tspan x="42" fill="#9d303b">  let </tspan><tspan fill="#3e2137">result</tspan><tspan fill="#70377f"> = </tspan><tspan fill="#647d34">fibonacci</tspan><tspan fill="#8c8fae">(</tspan><tspan fill="#34859d" font-style='italic'>n</tspan><tspan fill="#70377f"> - </tspan><tspan fill="#9a6348">1</tspan><tspan fill="#8c8fae">)</tspan></text>
<text x="14" y="133" fill="#9a6348"> 5</text>
<text y="133" xml:space="preserve"><tspan x="42" fill="#17434b">  return </tspan><tspan fill="#3e2137">result</tspan></text>
<text x="14" y="152" fill="#9a6348"> 6</text>
<text y="152" xml:space="preserve"><tspan x="42" fill="#8c8fae">}</tspan></text>
<text x="14" y="171" fill="#9a6348"> 7</text>
<text x="14" y="190" fill="#9a6348"> 8</text>
