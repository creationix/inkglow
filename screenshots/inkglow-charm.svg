<text y="399" xml:space="preserve"><tspan x="42" fill="#ef7d57">  let </tspan><tspan fill="#94b0c2">tmp</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#73eff7">*</tspan><tspan fill="#ef7d57" font-style='italic' font-weight='bold'>a</tspan></text>
<text x="14" y="418" fill="#566c86">20</text>
<text y="418" xml:space="preserve"><tspan x="42" fill="#41a6f6">  </tspan><tspan fill="#73eff7">*</tspan><tspan fill="#ef7d57" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#73eff7">*</tspan><tspan fill="#ef7d57" font-style='italic' font-weight='bold'>b</tspan></text>
<text x="14" y="437" fill="#566c86">21</text>
