<text x="14" y="57" fill="#566c86"> 1</text>
<text y="57" xml:space="preserve"><tspan x="42" fill="#566c86" font-style='italic'>// A sample to preview theme colors</tspan></text>
<text x="14" y="76" fill="#566c86"> 2</text>
<text y="76" xml:space="preserve"><tspan x="42" fill="#ef7d57">fn </tspan><tspan fill="#a7f070">fibonacci</tspan><tspan fill="#566c86">(</tspan><tspan fill="#41a6f6" font-style='italic'>n</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">u32</tspan><tspan fill="#566c86">)</tspan><tspan fill="#b13e53"> -&gt; </tspan><tspan fill="#73eff7">u32</tspan><tspan fill="#566c86"> {</tspan></text>
<text x="14" y="95" fill="#566c86"> 3</text>
<text y="95" xml:space="preserve"><tspan x="42" fill="#41a6f6">  if </tspan><tspan fill="#41a6f6" font-style='italic'>n</tspan><tspan fill="#b13e53"> &lt;= </tspan><tspan fill="#ffcd75">1</tspan><tspan fill="#41a6f6"> return </tspan><tspan fill="#41a6f6" font-style='italic'>n</tspan></text>
<text x="14" y="114" fill="#566c86"> 4</text>
<text y="114" xml:space="preserve"><tspan x="42" fill="#ef7d57">  let </tspan><tspan fill="#94b0c2">result</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#a7f070">fibonacci</tspan><tspan fill="#566c86">(</tspan><tspan fill="#41a6f6" font-style='italic'>n</tspan><tspan fill="#b13e53"> - </tspan><tspan fill="#ffcd75">1</tspan><tspan fill="#566c86">)</tspan></text>
<text x="14" y="133" fill="#566c86"> 5</text>
<text y="133" xml:space="preserve"><tspan x="42" fill="#41a6f6">  return </tspan><tspan fill="#94b0c2">result</tspan></text>
<text x="14" y="152" fill="#566c86"> 6</text>
<text y="152" xml:space="preserve"><tspan x="42" fill="#566c86">}</tspan></text>
<text x="14" y="171" fill="#566c86"> 7</text>
<text x="14" y="190" fill="#566c86"> 8</text>
<text y="190" xml:space="preserve"><tspan x="42" fill="#566c86" font-style='italic'>// Types and strings</tspan></text>
<text x="14" y="209" fill="#566c86"> 9</text>
<text y="209" xml:space="preserve"><tspan x="42" fill="#ef7d57">struct </tspan><tspan fill="#73eff7">Config</tspan><tspan fill="#566c86"> {</tspan></text>
