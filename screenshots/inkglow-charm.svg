<text x="14" y="361" fill="#566c86">17</text>
<text y="361" xml:space="preserve"><tspan x="42" fill="#ef7d57">let </tspan><tspan fill="#b13e53">GLOBAL_STATE</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#ffcd75">0</tspan></text>
<text x="14" y="380" fill="#566c86">18</text>
<text y="380" xml:space="preserve"><tspan x="42" fill="#ef7d57">fn </tspan><tspan fill="#a7f070">swap</tspan><tspan fill="#566c86">(</tspan><tspan fill="#ef7d57" font-style='italic' font-weight='bold'>a</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">*</tspan><tspan fill="#73eff7">u32</tspan><tspan fill="#b13e53">, </tspan><tspan fill="#ef7d57" font-style='italic' font-weight='bold'>b</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">*</tspan><tspan fill="#73eff7">u32</tspan><tspan fill="#566c86">)</tspan><tspan fill="#566c86"> {</tspan></text>
