<text y="228" xml:space="preserve"><tspan x="42" fill="#ef7d57">  </tspan><tspan fill="#94b0c2">name</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">String</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#38b764">&quot;hello world&quot;</tspan></text>
<text x="14" y="247" fill="#566c86">11</text>
<text y="247" xml:space="preserve"><tspan x="42" fill="#ef7d57">  </tspan><tspan fill="#94b0c2">count</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">u32</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#ffcd75">42</tspan></text>
<text x="14" y="266" fill="#566c86">12</text>
<text y="266" xml:space="preserve"><tspan x="42" fill="#ef7d57">  </tspan><tspan fill="#94b0c2">enabled</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">bool</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#e06080" font-style='italic'>true</tspan></text>
<text x="14" y="285" fill="#566c86">13</text>
<text y="285" xml:space="preserve"><tspan x="42" fill="#ef7d57">  </tspan><tspan fill="#94b0c2">path</tspan><tspan fill="#b13e53">: </tspan><tspan fill="#73eff7">String</tspan><tspan fill="#b13e53"> = </tspan><tspan fill="#38b764">&quot;line 1</tspan><tspan fill="#60c888" font-weight='bold'>\n</tspan><tspan fill="#38b764">line 2&quot;</tspan></text>
<text x="14" y="304" fill="#566c86">14</text>
<text y="304" xml:space="preserve"><tspan x="42" fill="#566c86">}</tspan></text>
<text x="14" y="323" fill="#566c86">15</text>
<text x="14" y="342" fill="#566c86">16</text>
