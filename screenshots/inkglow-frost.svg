<text y="228" xml:space="preserve"><tspan x="42" fill="#b13e53">  </tspan><tspan fill="#333c57">name</tspan><tspan fill="#5d275d">: </tspan><tspan fill="#257179">String</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#257179">&quot;hello world&quot;</tspan></text>
<text x="14" y="247" fill="#94b0c2">11</text>
<text y="247" xml:space="preserve"><tspan x="42" fill="#b13e53">  </tspan><tspan fill="#333c57">count</tspan><tspan fill="#5d275d">: </tspan><tspan fill="#257179">u32</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#b13e53">42</tspan></text>
<text x="14" y="266" fill="#94b0c2">12</text>
<text y="266" xml:space="preserve"><tspan x="42" fill="#b13e53">  </tspan><tspan fill="#333c57">enabled</tspan><tspan fill="#5d275d">: </tspan><tspan fill="#257179">bool</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#a03050" font-style='italic'>true</tspan></text>
