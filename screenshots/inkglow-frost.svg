<text x="14" y="361" fill="#94b0c2">17</text>
<text y="361" xml:space="preserve"><tspan x="42" fill="#b13e53">let </tspan><tspan fill="#5d275d">GLOBAL_STATE</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#b13e53">0</tspan></text>
