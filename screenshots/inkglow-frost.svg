<text y="76" xml:space="preserve"><tspan x="42" fill="#b13e53">fn </tspan><tspan fill="#38b764">fibonacci</tspan><tspan fill="#566c86">(</tspan><tspan fill="#3b5dc9" font-style='italic'>n</tspan><tspan fill="#5d275d">: </tspan><tspan fill="#257179">u32</tspan><tspan fill="#566c86">)</tspan><tspan fill="#5d275d"> -&gt; </tspan><tspan fill="#257179">u32</tspan><tspan fill="#566c86"> {</tspan></text>
<text x="14" y="95" fill="#94b0c2"> 3</text>
<text y="95" xml:space="preserve"><tspan x="42" fill="#3b5dc9">  if </tspan><tspan fill="#3b5dc9" font-style='italic'>n</tspan><tspan fill="#5d275d"> &lt;= </tspan><tspan fill="#b13e53">1</tspan><tspan fill="#3b5dc9"> return </tspan><tspan fill="#3b5dc9" font-style='italic'>n</tspan></text>
<text x="14" y="114" fill="#94b0c2"> 4</text>
<text y="114" xml:space="preserve"><tspan x="42" fill="#b13e53">  let </tspan><tspan fill="#333c57">result</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#38b764">fibonacci</tspan><tspan fill="#566c86">(</tspan><tspan fill="#3b5dc9" font-style='italic'>n</tspan><tspan fill="#5d275d"> - </tspan><tspan fill="#b13e53">1</tspan><tspan fill="#566c86">)</tspan></text>
<text x="14" y="133" fill="#94b0c2"> 5</text>
<text y="133" xml:space="preserve"><tspan x="42" fill="#3b5dc9">  return </tspan><tspan fill="#333c57">result</tspan></text>
<text x="14" y="152" fill="#94b0c2"> 6</text>
<text y="152" xml:space="preserve"><tspan x="42" fill="#566c86">}</tspan></text>
<text x="14" y="171" fill="#94b0c2"> 7</text>
