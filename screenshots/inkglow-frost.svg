<text y="285" xml:space="preserve"><tspan x="42" fill="#b13e53">  </tspan><tspan fill="#333c57">path</tspan><tspan fill="#5d275d">: </tspan><tspan fill="#257179">String</tspan><tspan fill="#5d275d"> = </tspan><tspan fill="#257179">&quot;line 1</tspan><tspan fill="#388a8c" font-weight='bold'>\n</tspan><tspan fill="#257179">line 2&quot;</tspan></text>
